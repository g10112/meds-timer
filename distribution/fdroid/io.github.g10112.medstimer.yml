AutoName: Meds Timer
Summary: Offline medication reminder alarms
Description: |-
  Meds Timer schedules three configurable medication reminder alarms after you press Start.
  It uses Android alarms and shows the remaining reminders on your phone and home-screen widgets.
  It works offline without ads, accounts, tracking or subscription payments.

  This is a reminder tool, not medical advice, a medical device or a dose tracker.
  Use your prescribed intervals and a backup alert for time-critical medication.

RepoType: git
Repo: https://github.com/g10112/meds-timer.git

